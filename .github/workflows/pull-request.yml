# Pull Request Workflow - Runs additional checks for PRs
name: 🔄 Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ master, develop ]

env:
  NODE_VERSION: '18'

jobs:
  pr-validation:
    name: 🔄 PR Validation
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout PR code
        uses: actions/checkout@v4
        with:
          # Fetch PR head for comparison
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔍 Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"
          
          # Check if PR title follows conventional commit format
          if [[ "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore)(\(.+\))?: .+ ]]; then
            echo "✅ PR title follows conventional commit format"
          else
            echo "❌ PR title should follow format: type(scope): description"
            echo "Examples: feat: add user authentication, fix(api): resolve login bug"
            exit 1
          fi

      - name: 📝 Check for changes in sensitive files
        run: |
          echo "Checking for changes in sensitive files..."
          SENSITIVE_FILES=".github/workflows package.json"
          CHANGED_FILES=$(git diff --name-only origin/master...HEAD || echo "")
          
          for file in $SENSITIVE_FILES; do
            if echo "$CHANGED_FILES" | grep -q "$file"; then
              echo "⚠️  Sensitive file modified: $file"
              echo "Please ensure this change is intentional and properly reviewed."
            fi
          done

      - name: 🧪 Run tests with coverage
        run: npm run test:coverage

      - name: 📊 Comment coverage on PR
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            // This is a simplified example - in reality you'd parse actual coverage data
            const coverageComment = `
            ## 📊 Test Coverage Report
            
            | File | Coverage | Lines | Functions | Branches |
            |------|----------|-------|-----------|----------|
            | src/app.js | 95% | 45/47 | 8/8 | 6/8 |
            | **Total** | **90%** | **45/50** | **8/10** | **6/10** |
            
            ✅ Coverage meets minimum threshold of 80%
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: coverageComment
            });

  size-impact:
    name: 📏 Bundle Size Impact
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout PR code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🏗️ Build PR version
        run: npm run build

      - name: 📏 Check bundle size
        run: |
          echo "Analyzing bundle size impact..."
          du -sh dist/ || echo "No dist folder found"
          
          # In a real project, you might use tools like bundlesize or size-limit
          echo "📦 Current build size: $(du -sh dist/ | cut -f1)"
          echo "This is a basic size check. In production, you'd compare against main branch."

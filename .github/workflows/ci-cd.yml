# CI/CD Workflow - Runs on every push and pull request
name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

env:
  NODE_VERSION: '18'

jobs:
  # JOB 1: Code Quality Checks
  lint-and-format:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint

      - name: 📊 Upload lint results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: eslint-report.json

  # JOB 2: Security Audit
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🔒 Run npm audit
        id: audit
        continue-on-error: true
        run: npm audit --audit-level moderate

      - name: 📚 Install dependencies
        if: steps.audit.outcome == 'failure'
        run: npm ci

      - name: 🛠️ Fix audit issues if audit failed
        if: steps.audit.outcome == 'failure'
        run: |
          echo "Audit failed, attempting to fix vulnerabilities..."
          npm audit fix
          
      - name: 💾 Commit audit fixes
        if: steps.audit.outcome == 'failure' && !contains(github.event.head_commit.message || '', 'npm audit fix')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package*.json
          if ! git diff --staged --quiet; then
            git commit -m "fix: apply npm audit fix to resolve vulnerabilities [skip ci]"
            # Retry loop for pull --rebase and push to handle race conditions
            MAX_RETRIES=3
            COUNT=0
            SUCCESS=0
            while [ $COUNT -lt $MAX_RETRIES ]; do
              git pull --rebase origin ${{ github.head_ref || github.ref_name }} && \
              git push origin HEAD:${{ github.head_ref || github.ref_name }}
              if [ $? -eq 0 ]; then
                SUCCESS=1
                break
              else
                echo "Push failed due to possible race condition. Retrying... ($((COUNT+1))/$MAX_RETRIES)"
                COUNT=$((COUNT+1))
                sleep 2
              fi
            done
            if [ $SUCCESS -ne 1 ]; then
              echo "Failed to push audit fixes after $MAX_RETRIES attempts."
              exit 1
            fi

      - name: 🛡️ Run security scan with npm audit
        if: steps.audit.outcome == 'success'
        run: npm audit --production

  # JOB 3: Testing
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16, 18, 20]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🧪 Run tests with coverage
        run: npm run test:coverage

      - name: 📊 Upload coverage reports to Codecov
        if: matrix.node-version == 18
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: 📦 Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            coverage/
            test-results.xml

  # JOB 4: Build Application
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: [lint-and-format, security-audit, test]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🏗️ Build application
        run: npm run build

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          retention-days: 7

  # JOB 5: Deploy to Staging (only on develop branch)
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: ./dist

      - name: 🚀 Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          echo "Build files:"
          ls -la ./dist
          # In a real scenario, you would deploy to your staging server
          # Examples: AWS S3, Heroku, Vercel, etc.
          echo "✅ Deployed successfully to staging!"

      - name: 🧪 Run smoke tests on staging
        run: |
          echo "Running smoke tests on staging..."
          # You would run actual tests against your staging environment
          echo "✅ Smoke tests passed!"

  # JOB 6: Deploy to Production (only on main branch)
  deploy-production:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: production
      url: https://production.example.com
    steps:
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: ./dist

      - name: 🌟 Deploy to production
        run: |
          echo "Deploying to production environment..."
          echo "Build files:"
          ls -la ./dist
          # In a real scenario, you would deploy to your production server
          echo "✅ Deployed successfully to production!"

      - name: 📢 Notify deployment
        run: |
          echo "🎉 Production deployment completed!"
          echo "Version: $(date '+%Y.%m.%d-%H.%M.%S')"
          # You could send notifications to Slack, Discord, email, etc.
